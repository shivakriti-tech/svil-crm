version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: svil_crm_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: svil
      POSTGRES_PASSWORD: svilcrm2026
      POSTGRES_DB: svil_crm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U svil -d svil_crm"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer
    container_name: svil_crm_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  postgres_data:
